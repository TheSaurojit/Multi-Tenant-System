services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_analytics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_analytics
    ports:
      # Bound to loopback only — change to "5432:5432" solely for local
      # tooling that must reach it from the host, never expose publicly.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

